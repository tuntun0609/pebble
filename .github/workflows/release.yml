name: Release

# Push a v* tag (e.g. v1.1.0) to build, sign, notarise and publish Pebble.
# The version is taken from the tag and injected into Info.plist, so the tag is
# the single source of truth for a release.
#
# macOS signing is OPTIONAL:
#   - Without MAC_CERTIFICATE_P12 the app is ad-hoc signed. It still runs, but
#     Gatekeeper warns on first launch (right-click -> Open, or remove the
#     quarantine attribute).
#   - With MAC_CERTIFICATE_P12 the app is signed with a Developer ID under the
#     hardened runtime, the DMG is notarised and the ticket stapled, so users
#     can double-click to run with no warning.
#
# Notarisation needs an App Store Connect API key (APPLE_API_KEY_P8,
# APPLE_API_KEY_ID, APPLE_API_ISSUER) or, failing that, an Apple ID
# (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.1.0 — no v prefix)'
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: Pebble

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          # reject anything that could break the plist, filenames or JSON below
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing Pebble $VERSION"

      - name: Probe signing secret
        id: signing
        env:
          P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
        run: |
          if [ -n "$P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MAC_CERTIFICATE_P12 not set — the build will be ad-hoc signed and NOT notarised. Users will see a Gatekeeper warning on first launch."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in MAC_CERTIFICATE_P12"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCHS: arm64 x86_64
          SIGN_IDENTITY: ${{ env.IDENTITY }}
        run: |
          ./build.sh
          lipo -archs build/Pebble.app/Contents/MacOS/Pebble

      - name: Create DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE=$RUNNER_TEMP/dmg
          mkdir -p "$STAGE"
          cp -R build/Pebble.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="Pebble-$VERSION.dmg"
          hdiutil create -volname "Pebble" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          if [ -n "$IDENTITY" ]; then
            codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarise and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            AUTH=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          # The DMG's ticket covers the app inside it too, so one submission
          # serves both: staple the DMG, and the app for the ZIP below.
          OUT=$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 30m --output-format json)
          echo "$OUT"
          ID=$(echo "$OUT" | jq -r .id)
          STATUS=$(echo "$OUT" | jq -r .status)
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" "${AUTH[@]}" || true
            rm -f "$RUNNER_TEMP/AuthKey.p8"
            echo "::error::Notarisation $STATUS"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$DMG"
          xcrun stapler staple build/Pebble.app
          spctl --assess --type execute --verbose=2 build/Pebble.app || true

      - name: Create ZIP
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ditto -c -k --keepParent build/Pebble.app "Pebble-$VERSION.zip"

      - name: Checksums
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          shasum -a 256 "$DMG" "Pebble-$VERSION.zip" > "Pebble-$VERSION.sha256"
          cat "Pebble-$VERSION.sha256"

      # The feed the app reads through GitHub's stable alias
      # .../releases/latest/download/latest.json. No REST API, so no
      # 60-per-hour rate limit for any number of users.
      - name: Generate update feed
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP_SHA=$(awk '$2 ~ /\.zip$/ {print $1}' "Pebble-$VERSION.sha256")
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "zip": "Pebble-$VERSION.zip",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/Pebble-$VERSION.zip",
            "sha256": "$ZIP_SHA",
            "page": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION"
          }
          EOF
          cat latest.json

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Pebble ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ env.DMG }}
            Pebble-${{ steps.ver.outputs.version }}.zip
            Pebble-${{ steps.ver.outputs.version }}.sha256
            latest.json
